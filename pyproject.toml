[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "8.0.0"
description = "JARVIS - Multi-Agent AI Operating System"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Brian Yang"}
]

dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiohttp>=3.8.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "jinja2>=3.1.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "beautifulsoup4>=4.12.0",
    "soundfile>=0.12.0",
    "aiofiles>=23.0.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
voice = [
    "openai-whisper>=20230918",
    "kokoro>=0.8.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.1.0",
]

[tool.coverage.run]
source = ["jarvis"]
omit = [
    "jarvis/agents/workers/*",   # worker tests not yet established
    "jarvis/voice/*",           # voice requires extra deps
    "jarvis/web/static/*",      # frontend assets
    "tests/*",                  # test code itself
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0

[project.scripts]
jarvis = "jarvis.cli:main"
jarvis-cli = "jarvis.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally use local fixture aliases with CamelCase (e.g. `Cat = IntentCategory`)
"tests/*" = ["N806"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=jarvis --cov-report=term-missing --cov-report=html:coverage_html"
